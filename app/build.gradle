plugins {
    id("com.google.devtools.ksp")
    id("kotlin-kapt")
}

apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

android {
    compileSdk = 36
    defaultConfig {
        applicationId = "com.example.cryptoapp"
        minSdk = 23
        targetSdk = 35
        versionCode = 1
        versionName = "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = "21"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'com.example.cryptoapp'
    buildFeatures {
        dataBinding = true
    }
}

dependencies {
    implementation("com.google.android.material:material:1.12.0")
    implementation 'com.google.dagger:dagger:2.60.1'
    kapt 'com.google.dagger:dagger-compiler:2.60.1'
    implementation 'com.google.dagger:dagger-android:2.60.1'
    implementation 'com.google.dagger:dagger-android-support:2.60.1'
    kapt 'com.google.dagger:dagger-android-processor:2.60.1'
    def work_version = "2.11.2"

    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'

    // (Java only)
    implementation "androidx.work:work-runtime:$work_version"

    // Kotlin + coroutines

    implementation "androidx.work:work-runtime-ktx:$work_version"

    implementation ("androidx.lifecycle:lifecycle-viewmodel-ktx:2.11.0")
    implementation 'androidx.room:room-ktx:2.2.1'


    implementation ("androidx.lifecycle:lifecycle-livedata-ktx:2.11.0")
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation "androidx.core:core-ktx:1.15.0"
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'


    implementation "androidx.room:room-runtime:2.6.1"
    ksp("androidx.room:room-compiler:2.6.1")

    implementation 'com.squareup.picasso:picasso:2.71828'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
}
